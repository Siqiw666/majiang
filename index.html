<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="一个简洁的单机麻将小游戏" />
    <title>青雀 · 麻将</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MAHJONG</p>
          <h1>青雀</h1>
        </div>
        <div class="game-actions">
          <span id="wall-count" class="wall-count">牌墙 84</span>
          <button id="fullscreen-toggle" class="button button-secondary fullscreen-button" type="button">全屏</button>
          <button id="reset-scores" class="button button-secondary" type="button">分数清零</button>
          <button id="new-game" class="button" type="button">重新开局</button>
        </div>
      </header>

      <section class="table" aria-label="麻将牌桌">
        <div class="opponent opponent-top">
          <div class="seat-info"><span class="seat">北</span><span id="score-2" class="score">0 分</span></div>
          <div class="tile-backs" id="player-2"></div>
        </div>
        <div class="opponent opponent-left">
          <div class="seat-info"><span class="seat">西</span><span id="score-1" class="score">0 分</span></div>
          <div class="tile-backs vertical" id="player-1"></div>
        </div>
        <div class="opponent opponent-right">
          <div class="seat-info"><span class="seat">东</span><span id="score-3" class="score">0 分</span></div>
          <div class="tile-backs vertical" id="player-3"></div>
        </div>

        <div class="center-panel">
          <div class="round-mark">南一局</div>
          <p id="status" class="status" aria-live="polite">正在洗牌…</p>
          <div id="claim-actions" class="claim-actions" hidden>
            <button id="win" class="claim-button win-button" type="button">胡</button>
            <button id="pong" class="claim-button" type="button">碰</button>
            <button id="kong" class="claim-button" type="button">杠</button>
            <button id="skip" class="claim-button secondary" type="button">过</button>
          </div>
          <div id="discards" class="discards" aria-label="弃牌区"></div>
        </div>

        <div class="player-area">
          <div class="player-label">
            <span class="seat active">南</span>
            <span>你的手牌</span>
            <span id="score-0" class="score player-score">0 分</span>
          </div>
          <div id="melds" class="melds" aria-label="你的亮牌区"></div>
          <div id="hand" class="hand" aria-label="你的手牌"></div>
          <div id="self-actions" class="self-actions" hidden>
            <button id="concealed-kong" class="claim-button" type="button">暗杠</button>
            <button id="confirm-discard" class="claim-button confirm-button" type="button">确认打出</button>
          </div>
          <p class="hint">先选择一张手牌，再确认打出；有相同牌时可以碰或杠</p>
        </div>
      </section>
    </main>

    <div id="result" class="result-overlay" hidden>
      <div class="result-card">
        <p class="eyebrow">本局结束</p>
        <h2 id="result-title">和牌</h2>
        <p id="result-message"></p>
        <button id="play-again" class="button button-large" type="button">再来一局</button>
      </div>
    </div>

    <div class="rotate-notice">
      <div class="phone-icon"><span></span></div>
      <h2>请横屏游玩</h2>
      <p id="fullscreen-message">点击进入全屏，然后将手机旋转 90°</p>
      <button id="start-fullscreen" class="button fullscreen-start" type="button">进入横屏全屏</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
